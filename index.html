<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Card</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;

        }
        div{
            width: 300px;
            height: 400px;
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            
        }
        img{
            width: 200px;
            height: 300;
            border-radius: 70%;
            object-fit: cover;
          
        }
        h1{
            margin-top: 20px;
            font-size: 24px;
            color: #333;
        }

    </style>
</head>
<body>
   <div>
    <img src="/AdityaDP.jpeg" alt="Aditya DP">
   <h1>Aditya Kumar</h1>
    
   </div> 
</body>
</html>
